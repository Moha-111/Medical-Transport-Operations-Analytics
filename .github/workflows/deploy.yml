name: 🚀 Deploy Wasl Platform

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ─── Validate HTML Quality ─────────────────────────────────────────
  validate:
    name: 🔍 Validate & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check file sizes
        run: |
          echo "📊 Repository file sizes:"
          du -sh * 2>/dev/null || true
          echo ""
          echo "📄 HTML file lines:"
          wc -l index.html

      - name: Validate HTML structure
        run: |
          if [ -f index.html ]; then
            echo "✅ index.html exists ($(wc -c < index.html) bytes)"
          else
            echo "❌ index.html missing"
            exit 1
          fi

      - name: Check for sensitive data
        run: |
          echo "🔒 Scanning for sensitive patterns..."
          # Check for hardcoded passwords or API keys (basic scan)
          if grep -rE "(password\s*=\s*['\"][^'\"]{4,}['\"]|api[_-]?key\s*=\s*['\"][^'\"]{8,}['\"])" index.html --include="*.html" --include="*.js" 2>/dev/null | grep -v "demo\|example\|placeholder\|YOUR_"; then
            echo "⚠️  Warning: Potential sensitive data found - please review"
          else
            echo "✅ No obvious sensitive patterns detected"
          fi

      - name: Generate build summary
        run: |
          echo "## 📊 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          for f in index.html README.md; do
            if [ -f "$f" ]; then
              SIZE=$(du -sh "$f" | cut -f1)
              echo "| $f | $SIZE |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Validation passed — ready for deployment" >> $GITHUB_STEP_SUMMARY

  # ─── Deploy to GitHub Pages ────────────────────────────────────────
  deploy:
    name: 🌐 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect GitHub Pages configuration
        id: pages
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o /tmp/pages-response.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/pages")

          if [ "$STATUS" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$STATUS" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ GitHub Pages is not enabled for ${{ github.repository }}; skipping deployment."
          else
            echo "Unexpected response while checking GitHub Pages configuration (HTTP $STATUS)."
            cat /tmp/pages-response.json
            exit 1
          fi

      - name: Setup Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4

      - name: Deployment skipped summary
        if: steps.pages.outputs.enabled != 'true'
        run: |
          echo "## 🚫 Deployment Skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "GitHub Pages is not enabled for this repository, so the deployment job exited without publishing." >> $GITHUB_STEP_SUMMARY

      - name: Deployment summary
        if: steps.pages.outputs.enabled == 'true'
        run: |
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **Live URL:** ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Wasl** platform is now live and accessible." >> $GITHUB_STEP_SUMMARY
