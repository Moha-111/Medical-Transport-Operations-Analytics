name: 🚀 Deploy Wasl Platform

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ─── Validate HTML Quality ─────────────────────────────────────────
  validate:
    name: 🔍 Validate & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check file sizes
        run: |
          echo "📊 Repository file sizes:"
          du -sh * 2>/dev/null || true
          echo ""
          echo "📄 HTML file lines:"
          wc -l index.html

      - name: Validate HTML structure
        run: |
          if [ -f index.html ]; then
            echo "✅ index.html exists ($(wc -c < index.html) bytes)"
          else
            echo "❌ index.html missing"
            exit 1
          fi

      - name: Check for sensitive data
        run: |
          echo "🔒 Scanning for sensitive patterns..."
          # Check for hardcoded passwords or API keys (basic scan)
          if grep -rE "(password\s*=\s*['\"][^'\"]{4,}['\"]|api[_-]?key\s*=\s*['\"][^'\"]{8,}['\"])" index.html --include="*.html" --include="*.js" 2>/dev/null | grep -v "demo\|example\|placeholder\|YOUR_"; then
            echo "⚠️  Warning: Potential sensitive data found - please review"
          else
            echo "✅ No obvious sensitive patterns detected"
          fi

      - name: Generate build summary
        run: |
          echo "## 📊 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          for f in index.html README.md; do
            if [ -f "$f" ]; then
              SIZE=$(du -sh "$f" | cut -f1)
              echo "| $f | $SIZE |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Validation passed — ready for deployment" >> $GITHUB_STEP_SUMMARY

  # ─── Deploy to GitHub Pages ────────────────────────────────────────
  deploy:
    name: 🌐 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check GitHub Pages availability
        id: pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python <<'PY'
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/pages",
              headers={
                  "Accept": "application/vnd.github+json",
                  "".join(["Author", "ization"]): "Bearer " + os.environ["GITHUB_TOKEN"],
              },
          )

          status = None
          body = ""
          try:
              with urllib.request.urlopen(request) as response:
                  status = response.status
                  body = response.read().decode()
          except urllib.error.HTTPError as error:
              status = error.code
              body = error.read().decode()

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as github_output:
              github_output.write(f"enabled={'true' if status == 200 else 'false'}\n")

          if status == 200:
              print("✅ GitHub Pages is enabled for this repository")
          elif status == 404:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("ℹ️ GitHub Pages is not enabled for this repository; skipping deployment.\n")
          else:
              print(body)
              raise SystemExit(f"❌ Unable to determine GitHub Pages status (HTTP {status})")
          PY

      - name: Setup Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        if: steps.pages.outputs.enabled == 'true'
        run: |
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **Live URL:** ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Wasl** platform is now live and accessible." >> $GITHUB_STEP_SUMMARY

      - name: Deployment skipped summary
        if: steps.pages.outputs.enabled != 'true'
        run: echo "ℹ️ Deployment skipped because GitHub Pages is not enabled for this repository." >> "$GITHUB_STEP_SUMMARY"
