# ─────────────────────────────────────────────────────────────────────────────
# Deploy — GitHub Pages Continuous Deployment
#
# Automatically publishes the Wasl dashboard to GitHub Pages whenever
# code is pushed to the main branch. The test suite must pass before
# any deployment proceeds.
#
# Live URL: https://moha-111.github.io/Medical-Transport-Operations-Analytics/
#
# Jobs:
#   test   — run the full Jest suite as a deployment gate
#   deploy — upload static files and publish to GitHub Pages
#
# To trigger a manual re-deploy without pushing code, use the
# "Run workflow" button in the GitHub Actions tab.
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy

on:
  push:
    branches: [main]      # auto-deploy on every push to main
  workflow_dispatch:       # allow manual trigger from the GitHub Actions UI

# Permissions required by the GitHub Pages deployment actions
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one deployment at a time; cancel in-progress runs if a new
# push arrives so the latest code is always what gets deployed
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Job 1: Test gate — the deploy job will not start unless this passes
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: Test gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # All 176 tests must pass before deployment is allowed to proceed
      - name: Run full test suite
        run: npm run test:ci

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2: Deploy — publish the static dashboard to GitHub Pages
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: test             # only runs when the test job succeeds
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configure the GitHub Pages environment for this repository
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Upload the entire repository root as the Pages artifact.
      # The .nojekyll file at the root prevents GitHub from running
      # Jekyll, so all files are served as-is.
      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # Publish the uploaded artifact to the live GitHub Pages URL
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Print the deployed URL to the job summary for quick access
      - name: Write deployment summary
        run: |
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Live URL** | ${{ steps.deployment.outputs.page_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
